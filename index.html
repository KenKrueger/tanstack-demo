<!doctype html>
<html class="bg-[#FAF7F2]" lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />
    <title>TanStack Router</title>
    <link href="/dist/styles.css" rel="stylesheet" />
    <style>
      #splashcontainer {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAF7F2;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.4s ease-out;
      }
      #splashcontainer.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        animation: splash-enter 0.6s ease-out;
      }
      @keyframes splash-enter {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        background: #2c2c2c;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      }
      .splash-name {
        font-family: 'Fraunces', serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #1c1917;
        letter-spacing: -0.02em;
      }
      .splash-dots {
        display: flex;
        gap: 6px;
      }
      .splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #a8a29e;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>

  <body class="font-outfit">
    <div id="app"></div>
    <div id="splashcontainer">
      <div id="splash">
        <div class="splash-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 21h18M3 10h18M5 6l7-3 7 3" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 10v11M8 10v11M12 10v11M16 10v11M20 10v11" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="splash-name">Fake Bank Inc.</div>
        <div class="splash-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- <script
      crossorigin="anonymous"
      src="//unpkg.com/react-scan/dist/auto.global.js"
    ></script> -->
  </body>
</html>
